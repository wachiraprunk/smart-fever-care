<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART FEVER CARE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4fafb;color:#18313a;font-family:Arial,'Noto Sans Thai',sans-serif}.shell{max-width:480px;min-height:100vh;margin:auto;background:#fff}.content{padding:20px}.top{padding:16px;border-bottom:1px solid #dcebee;display:flex;justify-content:space-between;color:#239aa5;font-weight:800}.hero,.card{border:1px solid #dcebee;border-radius:22px;padding:18px;margin-bottom:14px}.hero{text-align:center;background:#eaf7f8}.logo{font-size:30px;font-weight:800;color:#239aa5}.logo span{color:#ef7474}.illus{font-size:70px;margin:18px}.btn{width:100%;padding:13px;border:0;border-radius:15px;background:#239aa5;color:white;font-weight:800;margin-top:10px}.btn2{background:white;color:#239aa5;border:1px solid #239aa5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{min-height:115px;background:white;border:1px solid #dcebee;border-radius:18px;padding:15px;text-align:left}.menu b{display:block;margin-top:7px}.menu small,.small{color:#6d7d84;line-height:1.6}.option{width:100%;text-align:left;background:white;border:1px solid #dcebee;border-radius:14px;padding:12px;margin:7px 0}.selected{border-color:#239aa5;background:#eaf7f8}.bar{height:10px;background:#e8eff0;border-radius:20px}.bar i{display:block;height:100%;background:#239aa5;border-radius:20px}.check{display:block;border:1px solid #dcebee;border-radius:14px;padding:12px;margin:8px 0}.nav{position:sticky;bottom:0;background:white;border-top:1px solid #dcebee;display:flex;justify-content:space-around;padding:12px}.nav button{border:0;background:none;color:#6d7d84}.nav .active{color:#239aa5;font-weight:800}h1{font-size:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');let selected=null,sim=null,checks=[0,0,0,0,0],progress=40;
function nav(){return `<div class="nav"><button onclick="show('home')">⌂<br>หน้าหลัก</button><button onclick="show('progress')">◔<br>ความก้าวหน้า</button><button onclick="alert('ต้นแบบ: โปรไฟล์จะเพิ่มภายหลัง')">♙<br>โปรไฟล์</button></div>`}
function wrap(title,body){app.innerHTML=`<div class="shell"><div class="top"><span onclick="show('home')">‹ กลับ</span><span>SMART FEVER CARE</span><span></span></div><main class="content"><h1>${title}</h1>${body}</main>${nav()}</div>`}
function show(p){
if(p==='welcome'){app.innerHTML=`<div class="shell"><main class="content"><section class="hero"><div class="logo">SMART<br><span>FEVER CARE</span></div><b>เรียนรู้ เข้าใจ ทำได้<br>ดูแลลูกเมื่อมีไข้ อย่างมั่นใจ</b><div class="illus">👩‍🍼🌡️👶</div><button class="btn" onclick="show('pretest')">เริ่มต้นใช้งาน</button><button class="btn btn2" onclick="alert('Phase 2: เชื่อม LINE OA/LIFF')">เข้าสู่ระบบด้วย LINE</button><p class="small">สำหรับผู้ปกครองเด็กอายุ 1–5 ปี</p></section></main></div>`;return}
if(p==='pretest'){wrap('แบบประเมินก่อนเรียน',`<div class="card"><p><b>ข้อ 1 / 10</b></p><p>คำถามตัวอย่างสำหรับต้นแบบ</p>${['คำตอบ A','คำตอบ B','คำตอบ C','คำตอบ D'].map((x,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selected=${i};show('pretest')">○ ${x}</button>`).join('')}</div><button class="btn" onclick="show('home')">ไปหน้าหลัก</button><p class="small">ก่อนใช้จริงให้แทนด้วยเครื่องมือวิจัยฉบับที่ผ่านการตรวจสอบ</p>`);return}
if(p==='home'){wrap('สวัสดีค่ะ 👋',`<p class="small">ยินดีต้อนรับสู่ SMART FEVER CARE</p><div class="card"><b>ความก้าวหน้าของคุณ ${progress}%</b><div class="bar"><i style="width:${progress}%"></i></div></div><div class="grid">${[['📖','เรียนรู้','learn'],['🎥','วิดีโอสาธิต','video'],['🧠','ทดสอบความรู้','quiz'],['🎭','สถานการณ์จำลอง','simulation'],['✅','ประเมินตนเอง','checklist'],['📊','ความก้าวหน้า','progress']].map(x=>`<button class="menu" onclick="show('${x[2]}')"><span style="font-size:30px">${x[0]}</span><b>${x[1]}</b><small>เปิดกิจกรรม</small></button>`).join('')}</div>`);return}
if(p==='learn'){wrap('บทที่ 1 รู้จักไข้ในเด็ก',`<div class="card"><div class="illus">👶🌡️</div><b>เนื้อหาบทเรียน</b><p class="small">พื้นที่สำหรับใส่เนื้อหาที่ผ่านการตรวจสอบทางวิชาการ แบ่งเป็นข้อความสั้น ภาพ และคำถามระหว่างบทเรียน</p></div><div class="card"><b>หัวข้อย่อย</b><p>1. ความหมายและการประเมินไข้</p><p>2. การดูแลเด็กที่มีไข้</p><p>3. การเช็ดตัวลดไข้</p><p>4. สิ่งที่ควรทำและไม่ควรทำ</p><p>5. อาการเตือน</p></div><button class="btn" onclick="show('video')">ไปดูวิดีโอ</button>`);return}
if(p==='video'){wrap('วิธีเช็ดตัวลดไข้',`<div class="card" style="text-align:center"><div class="illus">▶️</div><b>พื้นที่สำหรับวิดีโอสาธิต</b><p class="small">นำวิดีโอของทีมวิจัยมาใส่ในขั้นนี้</p></div><div class="card"><b>STEP 1</b> เตรียมอุปกรณ์<br><b>STEP 2</b> ประเมินเด็ก<br><b>STEP 3</b> ปฏิบัติตามขั้นตอน<br><b>STEP 4</b> ประเมินหลังทำ</div><button class="btn" onclick="progress=Math.max(progress,55);show('quiz')">✓ ดูจบแล้ว</button>`);return}
if(p==='quiz'){wrap('แบบทดสอบความรู้',`<div class="card"><p><b>คำถามตัวอย่าง</b></p><p>ข้อใดควรพิจารณาเมื่อดูแลเด็กที่มีไข้?</p>${['ประเมินอาการและอุณหภูมิ','ห่มผ้าหนา ๆ เสมอ','ใช้น้ำเย็นจัด','ไม่สังเกตอาการ'].map((x,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selected=${i};show('quiz')">○ ${x}</button>`).join('')}${selected!==null?`<p class="small"><b>${selected===0?'✅ ตัวอย่างคำตอบที่เหมาะสม':'💡 ลองทบทวนบทเรียนอีกครั้ง'}</b></p>`:''}</div><button class="btn" onclick="progress=Math.max(progress,65);show('simulation')">ไปสถานการณ์จำลอง</button>`);return}
if(p==='simulation'){wrap('สถานการณ์จำลอง',`<div class="card"><b>สถานการณ์ 1/3</b><p>เด็กอายุ 3 ปี มีไข้และไม่สบายตัว ผู้ปกครองควรพิจารณาอะไรเป็นอันดับแรก?</p></div>${['เช็ดตัวทันทีโดยไม่ประเมิน','ให้ยาทันทีโดยไม่ประเมิน','ประเมินอาการและวัดไข้ก่อน','ห่มผ้าและรอดูอาการ'].map((x,i)=>`<button class="option ${sim===i?'selected':''}" onclick="sim=${i};show('simulation')">○ ${x}</button>`).join('')}<button class="btn" onclick="progress=Math.max(progress,75);show('checklist')">ส่งคำตอบ</button>`);return}
if(p==='checklist'){wrap('ฉันมั่นใจว่าฉันสามารถ...',`<p class="small">ต้นแบบ self-efficacy checklist</p>${['เตรียมอุปกรณ์ได้','วัดอุณหภูมิได้','ปฏิบัติตามขั้นตอนได้','สังเกตอาการผิดปกติได้','ตัดสินใจว่าควรไปพบแพทย์เมื่อใด'].map((x,i)=>`<label class="check"><input type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked?1:0"> ${x}</label>`).join('')}<button class="btn" onclick="progress=Math.max(progress,85);show('progress')">บันทึกผล</button>`);return}
if(p==='progress'){wrap('ความก้าวหน้าของคุณ',`<div class="card" style="text-align:center"><div style="font-size:44px;color:#239aa5;font-weight:800">${progress}%</div><div class="bar"><i style="width:${progress}%"></i></div></div><div class="card">📖 E-learning — 3/3<br><br>🎥 Video — 1/1<br><br>🧠 Quiz — 1/1<br><br>🎭 Simulation — 1/3<br><br>✅ Checklist — 1/1</div><button class="btn" onclick="show('posttest')">ไป Post-test</button>`);return}
if(p==='posttest'){wrap('แบบประเมินหลังเรียน',`<div class="card" style="text-align:center"><div class="illus">🎉</div><h2>เรียนครบกิจกรรมแล้ว!</h2><p class="small">หน้านี้เป็นต้นแบบสำหรับนำเครื่องมือวิจัยฉบับจริงมาใส่</p></div><button class="btn" onclick="show('home')">กลับหน้าหลัก</button>`);return}}
show('welcome');
</script>
</body>
</html>
