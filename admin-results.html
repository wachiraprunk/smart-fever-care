<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART FEVER CARE · หลังบ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Prompt,sans-serif;background:#F5F8FB;color:#183247;margin:0}
header{background:#073B66;color:#fff;padding:18px 5%}
main{max-width:1100px;margin:auto;padding:24px 5% 60px}
.card{background:#fff;border:1px solid #E4EBF2;border-radius:18px;padding:18px;margin-bottom:16px}
button{border:none;background:#F28C28;color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #E4EBF2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border:1px solid #E4EBF2;border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px;color:#073B66}
</style>
</head>
<body>
<header>
  <h1>หลังบ้าน SMART FEVER CARE</h1>
  <p>ดึงผลจากตาราง sfc_records</p>
</header>
<main>
  <div class="card">
    <button onclick="loadRows()">รีเฟรช</button>
    <button onclick="exportCsv()">ดาวน์โหลด CSV</button>
    <p id="status">กำลังดึงข้อมูล...</p>
  </div>
  <div class="stats">
    <div class="stat"><span>ผู้ใช้ทั้งหมด</span><b id="nUsers">—</b></div>
    <div class="stat"><span>มีผลก่อนเรียน</span><b id="nPre">—</b></div>
    <div class="stat"><span>มีผลหลังเรียน</span><b id="nPost">—</b></div>
    <div class="stat"><span>คะแนนหลังเรียนเฉลี่ย</span><b id="nAvg">—</b></div>
  </div>
  <div class="card" style="overflow:auto">
    <table>
      <thead><tr><th>ชื่อ</th><th>บัญชี</th><th>ก่อนเรียน</th><th>หลังเรียน</th><th>บทเรียน</th><th>วิดีโอ</th><th>สถานการณ์</th><th>อัปเดต</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const db=window.supabase.createClient("https://urqkglxfzusdjwvtnizv.supabase.co","sb_publishable_Lm5h8Ck36cvPFT0ctEYHCw_EY6n6l97");
let rows=[];
function esc(v){return String(v==null?"":v).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");}
async function loadRows(){
  document.getElementById("status").innerText="กำลังดึงข้อมูล...";
  const res=await db.from("sfc_records").select("*").order("updated_at",{ascending:false});
  if(res.error){ document.getElementById("status").innerText="ดึงไม่สำเร็จ: "+res.error.message; return; }
  rows=res.data||[];
  document.getElementById("status").innerText="ดึงได้ "+rows.length+" รายการ";
  document.getElementById("nUsers").innerText=rows.length;
  document.getElementById("nPre").innerText=rows.filter(r=>r.pre_score!=null).length;
  document.getElementById("nPost").innerText=rows.filter(r=>r.post_score!=null).length;
  const posts=rows.map(r=>Number(r.post_score)).filter(v=>!Number.isNaN(v)&&rOk(v));
  function rOk(v){return v!==null;}
  const valid=rows.map(r=>r.post_score).filter(v=>v!=null);
  document.getElementById("nAvg").innerText=valid.length? Math.round(valid.reduce((a,b)=>a+Number(b),0)/valid.length)+"%" : "—";
  document.getElementById("rows").innerHTML=rows.map(r=>"<tr><td>"+esc(r.name)+"</td><td>"+esc(r.user_key)+"</td><td>"+(r.pre_score==null?"—":r.pre_score+"%")+"</td><td>"+(r.post_score==null?"—":r.post_score+"%")+"</td><td>"+(r.lessons_done||0)+"/5</td><td>"+(r.videos_done||0)+"/3</td><td>"+(r.scenarios_done||0)+"/10</td><td>"+esc(String(r.updated_at||"").replace("T"," ").slice(0,16))+"</td></tr>").join("") || "<tr><td colspan='8'>ยังไม่มีข้อมูล</td></tr>";
}
function exportCsv(){
  if(!rows.length){ alert("ยังไม่มีข้อมูล"); return; }
  const head=["name","user_key","pre_score","post_score","lessons_done","videos_done","scenarios_done","updated_at"];
  const lines=[head.join(",")].concat(rows.map(r=>head.map(k=>'"'+String(r[k]==null?"":r[k]).replace(/"/g,'""')+'"').join(",")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="smart-fever-care-users.csv";
  a.click();
}
loadRows();
</script>
</body>
</html>
